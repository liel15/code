<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마라탕 메모 의식</title>
  <style>
    :root {
      --bg: #170705;
      --panel: rgba(40, 15, 12, 0.88);
      --panel2: rgba(56, 20, 15, 0.96);
      --line: rgba(255,255,255,0.09);
      --text: #fff4ed;
      --muted: #d7b6ae;
      --hot: #ff6a4a;
      --hot2: #ff9f57;
      --gold: #f7c66a;
      --shadow: 0 24px 70px rgba(0,0,0,.38);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 111, 74, .22), transparent 18%),
        radial-gradient(circle at 80% 10%, rgba(247, 198, 106, .12), transparent 18%),
        linear-gradient(180deg, #140604 0%, #1b0907 100%);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .noise {
      position: fixed; inset: 0; pointer-events: none; opacity: .1;
      background-image: linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 38px 38px;
    }
    .app {
      width: min(1440px, calc(100% - 24px));
      margin: 0 auto;
      padding: 18px 0 24px;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 16px;
      min-height: 100vh;
    }
    .sidebar, .receipt, .scene, .topbar {
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .sidebar {
      position: sticky; top: 18px; height: calc(100vh - 36px);
      display: grid; grid-template-rows: auto auto 1fr; gap: 12px;
      padding: 16px; border-radius: 28px; background: linear-gradient(180deg, rgba(56,20,15,.92), rgba(26,11,9,.98)); overflow: hidden;
    }
    .brand { display: flex; gap: 12px; align-items: center; }
    .brand-mark { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #240c08; background: linear-gradient(135deg, var(--hot2), var(--hot)); }
    .brand strong { display:block; font-size: 1rem; letter-spacing: -.04em; }
    .brand span { display:block; margin-top: 4px; color: var(--muted); font-size: .83rem; line-height: 1.45; }
    .history-head { display:flex; justify-content: space-between; align-items:center; gap:10px; }
    .history-head h2 { margin:0; font-size: .98rem; }
    .chip, .btn, .small {
      border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text);
      transition: 160ms ease;
    }
    .btn, .small { min-height: 44px; padding: 0 14px; }
    .btn:hover, .small:hover, .memo-item:hover { transform: translateY(-1px); }
    .history-list { overflow:auto; display:grid; gap:10px; padding-right: 4px; }
    .memo-item { text-align:left; padding: 14px; border-radius: 20px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text); }
    .memo-item.active { border-color: rgba(255,159,87,.45); background: rgba(255,159,87,.1); }
    .memo-title-row { display:flex; justify-content: space-between; gap: 8px; align-items:center; }
    .memo-title { font-weight:800; letter-spacing:-.04em; }
    .memo-meta, .memo-sub { color: var(--muted); font-size: .84rem; line-height: 1.45; }
    .main { display:grid; grid-template-rows: auto auto 1fr; gap: 12px; min-width: 0; }
    .topbar {
      display:flex; justify-content: space-between; align-items:center; gap: 14px;
      padding: 14px 16px; border-radius: 999px; background: rgba(42,16,13,.74);
    }
    .top-left { display:flex; align-items:center; gap: 12px; min-width:0; }
    .mode-chip { padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(255,159,87,.2); background: rgba(255,159,87,.12); color: #ffd8bf; font-size: .84rem; }
    .memo-label { color: var(--muted); overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-actions { display:flex; gap: 10px; flex-wrap: wrap; }
    .scene-shell { display:grid; grid-template-columns: minmax(0, 1fr) 344px; gap: 14px; min-height: 0; }
    .scene-shell.start-mode { grid-template-columns: minmax(0, 1fr) 280px; }
    .scene { min-width: 0; border-radius: 30px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(39,15,12,.92), rgba(20,8,7,.98)); box-shadow: var(--shadow); min-height: 680px; overflow:hidden; }
    .receipt { min-height: 680px; border-radius: 30px; background: linear-gradient(180deg, rgba(56,20,15,.92), rgba(23,8,7,.98)); overflow:hidden; display:grid; grid-template-rows: auto 1fr; }
    .receipt-head { display:flex; justify-content: space-between; align-items:center; gap:10px; padding: 18px; border-bottom: 1px solid var(--line); }
    .receipt-head h2 { margin:0; font-size: 1rem; }
    .receipt-body { padding: 18px; overflow:auto; display:grid; gap: 14px; }
    .receipt-block { padding: 14px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,.03); display:grid; gap: 10px; }
    .receipt-title { display:flex; justify-content: space-between; gap:10px; align-items:center; font-weight:800; }
    .empty-note, .status-note, .receipt-note, .timeline-sub { color: var(--muted); font-size: .88rem; line-height: 1.55; }
    .pill { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color:#fbe9e5; font-size: .8rem; }
    .start, .detail, .play { padding: 24px; display:grid; gap: 16px; }
    .intro { min-height: 530px; border-radius: 26px; border: 1px solid var(--line); display:grid; place-items:center; padding: 24px; background: radial-gradient(circle at 50% 20%, rgba(255,159,87,.16), transparent 24%), linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)); position:relative; }
    .intro-copy { text-align:center; max-width: 680px; display:grid; gap: 14px; justify-items:center; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; padding: 9px 14px; border-radius: 999px; border: 1px solid rgba(255,159,87,.18); background: rgba(255,159,87,.08); color: #ffd8bf; font-size:.92rem; }
    .intro h1 { margin:0; font-size: clamp(2.6rem, 5vw, 5rem); line-height:.95; letter-spacing:-.08em; }
    .intro p { margin:0; max-width: 54ch; color: var(--muted); line-height:1.8; }
    .start-form { position:absolute; left:50%; bottom: 24px; transform: translateX(-50%); width: min(620px, calc(100% - 28px)); display:grid; gap: 12px; }
    .input-row { display:grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .memo-input { min-height: 58px; border-radius: 18px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: var(--text); padding: 0 18px; outline:none; }
    .memo-input:focus { box-shadow: 0 0 0 4px rgba(255,159,87,.08); border-color: rgba(255,159,87,.5); }
    .primary { min-height: 58px; padding: 0 20px; border-radius: 18px; border: 1px solid transparent; color: #250d09; background: linear-gradient(135deg, var(--hot2), var(--hot)); font-weight: 800; }
    .ghost { min-height: 58px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line); color: var(--text); background: rgba(255,255,255,.04); }
    .helper-row { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; color: var(--muted); font-size: .88rem; }
    .scene-body { padding: 24px; display:grid; gap: 16px; }
    .scene-header { display:flex; justify-content: space-between; align-items:end; gap: 12px; }
    .scene-header h2 { margin:0; font-size: 1.1rem; letter-spacing: -.04em; }
    .scene-header p { margin:4px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    .stage { min-height: 440px; border-radius: 26px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(34,14,12,.98), rgba(19,8,7,.98)); padding: 18px; display:grid; gap: 14px; align-content:start; }
    .pot-wrap { display:grid; gap: 16px; justify-items:center; }
    .vessel { width:min(100%, 620px); position:relative; display:grid; justify-items:center; }
    .vessel-shell { position:relative; width:100%; min-height: 260px; display:grid; place-items:center; }
    .vessel-shell::before,
    .vessel-shell::after { content:""; position:absolute; inset:auto; pointer-events:none; }
    .vessel.cooking .vessel-shell { min-height: 250px; }
    .vessel.cooking .vessel-shell::before {
      left: 26px; right: 26px; bottom: 42px; height: 34px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(255,255,255,.04)); filter: blur(.3px);
    }
    .vessel.cooking .vessel-shell::after {
      left: 0; right: 0; top: 42px; height: 28px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0)); opacity:.85;
    }
    .vessel.eating .vessel-shell { min-height: 280px; }
    .vessel.eating .vessel-shell::before {
      left: 50%; transform: translateX(-50%); bottom: 22px; width: 74%; height: 36px; border-radius: 999px;
      background: radial-gradient(circle at 50% 0%, rgba(0,0,0,.22), rgba(0,0,0,.02)); filter: blur(.4px);
    }
    .vessel.eating .vessel-shell::after {
      left: 50%; transform: translateX(-50%); top: 28px; width: 88%; height: 150px; border-radius: 0 0 48% 48% / 0 0 34% 34%;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
      box-shadow: inset 0 -16px 26px rgba(0,0,0,.24);
    }
    .vessel.cooking .vessel-shell::before { box-shadow: 0 24px 60px rgba(0,0,0,.28); }
    .vessel-handle { position:absolute; top: 78px; width: 96px; height: 96px; border-radius: 50%; border: 14px solid rgba(255,255,255,.06); }
    .vessel-handle.left { left: 8px; }
    .vessel-handle.right { right: 8px; }
    .vessel.cooking .vessel-handle { display:block; }
    .vessel.eating .vessel-handle { display:none; }
    .vessel-body {
      position:relative; z-index:1; width:100%; min-height: 240px; border: 1px solid rgba(255,255,255,.1); overflow:hidden;
    }
    .vessel.cooking .vessel-body {
      width: min(100%, 560px); min-height: 240px; border-radius: 36px 36px 26px 26px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.12), transparent 38%),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -10px 22px rgba(0,0,0,.18);
    }
    .vessel.eating .vessel-body {
      width: min(100%, 600px); min-height: 280px; border-radius: 0 0 38% 38% / 0 0 22% 22%;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.12), transparent 36%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow: inset 0 -18px 26px rgba(0,0,0,.22), inset 0 10px 24px rgba(255,255,255,.04);
    }
    .steam {
      position:absolute; top: 0; left: 50%; width: 240px; height: 120px; transform: translateX(-50%); pointer-events:none;
      filter: blur(2px); opacity: .7;
    }
    .steam span {
      position:absolute; bottom: 0; width: 56px; height: 90px; border-radius: 50%;
      background: radial-gradient(circle at 50% 70%, rgba(255,255,255,.9), rgba(255,255,255,0) 72%);
      animation: steamFloat 3.4s ease-in-out infinite;
    }
    .steam span:nth-child(1) { left: 22px; animation-delay: .1s; }
    .steam span:nth-child(2) { left: 92px; animation-delay: .7s; }
    .steam span:nth-child(3) { left: 152px; animation-delay: 1.3s; }
    @keyframes steamFloat {
      0%, 100% { transform: translateY(0) scale(.92); opacity: .25; }
      50% { transform: translateY(-12px) scale(1); opacity: .8; }
    }
    .pot { width:100%; min-height: 240px; position:relative; overflow:hidden; }
    .dish-illustration {
      width: min(100%, 660px);
      margin-inline: auto;
      display:block;
      filter: drop-shadow(0 24px 40px rgba(0,0,0,.28));
    }
    .broth { position:absolute; inset: 26px 20px 26px; border-radius: 28px; background: radial-gradient(circle at 30% 20%, rgba(255,184,135,.45), transparent 30%), radial-gradient(circle at 70% 20%, rgba(255,107,74,.32), transparent 28%), linear-gradient(180deg, rgba(255,117,72,.42), rgba(121, 27, 18, .84)); }
    .broth::before {
      content:""; position:absolute; inset: 12px 16px auto; height: 18px; border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,.34), rgba(255,255,255,0)); opacity:.22;
      filter: blur(1px);
    }
    .broth::after { content:""; position:absolute; inset:0; background-image: radial-gradient(circle at 20% 25%, rgba(255,255,255,.08) 0 5px, transparent 7px), radial-gradient(circle at 78% 60%, rgba(255,255,255,.06) 0 4px, transparent 6px), radial-gradient(circle at 55% 34%, rgba(255,255,255,.06) 0 4px, transparent 6px); opacity:.56; }
    .broth-rim {
      position:absolute; left: 12px; right: 12px; top: 18px; height: 22px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.09); background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
    }
    .utensil {
      position:absolute; z-index:2; pointer-events:none; opacity:.95;
    }
    .utensil.spoon {
      right: 22px; top: 36px; width: 120px; height: 240px;
      transform: rotate(18deg);
    }
    .utensil.spoon::before {
      content:""; position:absolute; right: 0; top: 0; width: 72px; height: 118px; border-radius: 50% 50% 42% 42%;
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(205,219,229,.7));
      box-shadow: inset 0 -8px 14px rgba(0,0,0,.08), 0 10px 20px rgba(0,0,0,.15);
    }
    .utensil.spoon::after {
      content:""; position:absolute; right: 28px; top: 104px; width: 18px; height: 150px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(185,198,206,.82));
    }
    .utensil.chopsticks {
      left: 30px; top: 48px; width: 140px; height: 120px; transform: rotate(-14deg);
    }
    .utensil.chopsticks::before,
    .utensil.chopsticks::after {
      content:""; position:absolute; left: 0; top: 36px; width: 146px; height: 8px; border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,216,191,.95), rgba(255,159,87,.95));
      box-shadow: 0 8px 20px rgba(0,0,0,.16);
    }
    .utensil.chopsticks::after { top: 58px; left: 10px; width: 138px; }
    .vessel.cooking .steam { display:block; }
    .vessel.eating .steam { display:none; }
    .vessel.cooking .utensil { display:none; }
    .vessel.eating .utensil { display:block; }
    .ingredients-in-pot { position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:8px; padding: 10px; min-height: 170px; align-content:start; }
    .ingredient { display:inline-flex; align-items:center; gap:8px; padding: 10px 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: #fff6f0; user-select:none; }
    .ingredient[draggable="true"] { cursor: grab; }
    .ingredient .price { color:#ffd8bf; font-weight: 800; }
    .empty-pot { position:relative; z-index:1; min-height: 156px; display:grid; place-items:center; text-align:center; padding: 20px; color:#ffd8bf; font-weight:700; }
    .empty-pot span { display:block; margin-top: 8px; color: var(--muted); font-weight:500; font-size:.9rem; line-height:1.6; }
    .spice-row { display:grid; grid-template-columns: auto minmax(0,1fr) auto; gap:12px; align-items:center; }
    .spice-meter { height: 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.06); overflow:hidden; }
    .spice-fill { height:100%; width: 18%; border-radius: inherit; background: linear-gradient(90deg, var(--hot), var(--hot2), #ff324d); box-shadow: 0 0 16px rgba(255,107,74,.35); transition: width 180ms ease; }
    .controls, .tray-head { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
    .tray { display:grid; gap: 10px; padding: 14px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
    .tray-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; }
    .mouth { border-radius: 22px; border: 1px dashed rgba(255,255,255,.12); padding: 14px; text-align:center; color:#ffd8bf; background: rgba(255,255,255,.02); }
    .mouth.dragover { background: rgba(255,159,87,.12); border-color: rgba(255,159,87,.5); box-shadow: 0 0 0 4px rgba(255,159,87,.08); }
    .spice-side { display:grid; gap:12px; }
    .vertical-meter { display:grid; justify-items:center; gap: 10px; padding: 18px; border-radius: 26px; border: 1px solid var(--line); background: rgba(255,255,255,.04); }
    .track { width: 88px; height: 260px; padding: 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08); background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); display:flex; align-items:flex-end; overflow:hidden; }
    .fill { width:100%; border-radius:999px; background: linear-gradient(180deg, #ff324d, var(--hot), var(--hot2)); box-shadow: 0 0 18px rgba(255,107,74,.35); transition: height 180ms ease; }
    .meter-value { font-size: 1.9rem; font-weight: 900; letter-spacing: -.06em; }
    .overlay { position: fixed; inset: 0; left: 0; transform: none; z-index: 60; display:none; place-items:center; background: rgba(8,3,2,.5); backdrop-filter: blur(10px); padding: 24px; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(20px); z-index: 60; }
    .overlay.show { display:grid; }
    .overlay-card { width:min(620px, calc(100vw - 32px)); border-radius: 30px; border:1px solid rgba(255,255,255,.1); background: linear-gradient(180deg, rgba(56,20,15,.98), rgba(18,7,6,.98)); box-shadow: var(--shadow); padding: 26px; text-align:center; position: relative; overflow:hidden; }
    .overlay-card::before {
      content:""; position:absolute; inset:auto 10% 18px; height: 12px; border-radius:999px;
      background: radial-gradient(circle, rgba(255,159,87,.35), transparent 70%);
      filter: blur(6px); opacity:.75;
    }
    .overlay-title { margin:0 0 8px; font-size: clamp(1.7rem, 3vw, 2.6rem); letter-spacing:-.06em; }
    .overlay-sub { margin:0; color: var(--muted); line-height:1.7; }
    .toast { bottom: 24px; opacity:0; transform: translateX(-50%) translateY(20px); pointer-events:none; padding: 14px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1); background: rgba(28,10,8,.92); transition: 220ms ease; }
    .toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
    .timeline { display:grid; gap:10px; padding: 16px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255,255,255,.04); }
    .timeline-item { padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.03); display:grid; gap:4px; text-align:left; color: var(--text); }
    .timeline-item.active { border-color: rgba(255,159,87,.32); background: rgba(255,159,87,.1); }
    .collapsed .brand-copy, .collapsed .history-head, .collapsed .history-list { display:none; }
    .collapsed { width: 86px; min-width: 86px; }
    .collapsed .collapsed-label { display:grid; place-items:center; color: var(--muted); letter-spacing:.2em; writing-mode: vertical-rl; transform: rotate(180deg); min-height: 300px; }
    .collapsed-label { display:none; }
    .ingredient {
      display:grid;
      justify-items:center;
      gap: 6px;
      padding: 10px 10px 12px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: #fff6f0;
      user-select:none;
      text-align:center;
      min-width: 0;
    }
    .ingredient[draggable="true"] { cursor: grab; }
    .ingredient .price { color:#ffd8bf; font-weight: 800; font-size: .8rem; }
    .ingredient-name { font-size: .84rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; }
    .ingredient-img {
      width: 78px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.25));
      pointer-events:none;
      user-select:none;
    }
    .ingredient-mini {
      display:inline-grid;
      grid-auto-flow: column;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.035);
    }
    .ingredient-mini .ingredient-img { width: 44px; height: 34px; }
    .ingredient-mini .ingredient-name { font-size: .78rem; }
    .ingredient-mini .price { font-size: .74rem; }
    @media (max-width: 1180px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position:relative; height:auto; }
      .scene-shell { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .app { width: min(100% - 16px, 100%); }
      .topbar { border-radius: 26px; flex-direction:column; align-items:start; }
      .input-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">🌶️</div>
        <div class="brand-copy">
          <strong>마라탕 메모 의식</strong>
          <span>메모를 히스토리에 남기고, 마라탕 장면으로 다시 꺼내는 독립 웹 사이트</span>
        </div>
      </div>
      <div class="history-head">
        <h2>히스토리</h2>
        <button class="btn" id="newMemoButton" type="button">새 메모</button>
      </div>
      <div class="collapsed-label">HISTORY</div>
      <div class="history-list" id="historyList"></div>
    </aside>

    <main class="main">
      <header class="topbar">

      <section class="scene-shell start-mode" id="sceneShell">

  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "maratang-memo-ritual-site.v1";
    const INGREDIENTS = [
      { id: "beef", name: "소고기", price: 1200, emoji: "🥩" },
      { id: "glass", name: "당면", price: 700, emoji: "🧵" },
      { id: "mushroom", name: "버섯", price: 500, emoji: "🍄" },
      { id: "fishball", name: "피쉬볼", price: 800, emoji: "⚪" },
      { id: "tofu", name: "두부", price: 600, emoji: "◼️" },
      { id: "cabbage", name: "청경채", price: 450, emoji: "🥬" },
      { id: "sausage", name: "소시지", price: 650, emoji: "🌭" },
      { id: "shrimp", name: "새우", price: 1100, emoji: "🦐" },
      { id: "moon", name: "분모자", price: 900, emoji: "🪭" },
      { id: "ricecake", name: "떡", price: 550, emoji: "🍥" },
      { id: "noodle", name: "면", price: 750, emoji: "🍜" },

    const INITIAL_SPICE = 18;
    const BROTH_BASE = 1800;
    const state = loadState();
    const ui = { mode: "start", detailId: null, detailIndex: 0, collapsedHistory: false, detailTimer: null, stunTicker: null, dragIngredientId: null, lastEatAt: 0, eatCombo: 0, overlayUntil: 0, overlayText: "", overlaySub: "", confetti: false };
    const els = {
      sidebar: document.getElementById("sidebar"), historyList: document.getElementById("historyList"), sceneShell: document.getElementById("sceneShell"), scene: document.getElementById("scene"),
      receiptPanel: document.getElementById("receiptPanel"), receiptBody: document.getElementById("receiptBody"), receiptModePill: document.getElementById("receiptModePill"), modeChip: document.getElementById("modeChip"), memoLabel: document.getElementById("memoLabel"),
      newMemoButton: document.getElementById("newMemoButton"), toggleHistoryButton: document.getElementById("toggleHistoryButton"), restoreActiveButton: document.getElementById("restoreActiveButton"), overlay: document.getElementById("overlay"), toast: document.getElementById("toast")
    };

    bind(); render(); startTickers();

    function bind() {
      document.addEventListener("submit", (e) => {
        if (e.target?.id !== "startForm") return;
        e.preventDefault(); createMemo(document.getElementById("memoInput").value.trim());
      }, true);
      document.addEventListener("click", (e) => {
        const action = e.target.closest("[data-action]")?.dataset.action;
        const historyId = e.target.closest("[data-history-id]")?.dataset.historyId;
        const timelineIndex = e.target.closest("[data-timeline-index]")?.dataset.timelineIndex;
        const ingredientId = e.target.closest("[data-ingredient-id]")?.dataset.ingredientId;
        const spiceValue = e.target.closest("[data-spice-value]")?.dataset.spiceValue;
        if (historyId) return openDetail(historyId);
        if (timelineIndex !== undefined) { ui.detailIndex = Number(timelineIndex); return render(); }
        if (action === "start-memo") return createMemo(document.getElementById("memoInput").value.trim());
        if (action === "add-ingredient") return addIngredient(ingredientId);
        if (action === "eat-bite") return eatBite();
        if (action === "serve") return serveCurrentMemo();
        if (action === "complete") return completeCurrentMemo();
        if (action === "replay") return startReplay();
        if (action === "back-start") return goStart();
        if (action === "collapse-history") { ui.collapsedHistory = !ui.collapsedHistory; return render(); }
        if (action === "spice-step") return setSpice(Number(spiceValue));
        if (action === "close-overlay") { ui.overlayUntil = 0; ui.overlayText = ""; ui.overlaySub = ""; return render(); }
      });
      document.addEventListener("dragstart", (e) => {
        const node = e.target.closest("[data-ingredient-id]"); if (!node) return; ui.dragIngredientId = node.dataset.ingredientId; e.dataTransfer.effectAllowed = "copy"; e.dataTransfer.setData("text/plain", ui.dragIngredientId);
      });
      document.addEventListener("dragover", (e) => { const node = e.target.closest("[data-drop-target]"); if (!node) return; e.preventDefault(); node.classList.add("dragover"); });
      document.addEventListener("dragleave", (e) => { const node = e.target.closest("[data-drop-target]"); if (!node) return; node.classList.remove("dragover"); });
      document.addEventListener("drop", (e) => {
        const node = e.target.closest("[data-drop-target]"); if (!node) return; e.preventDefault(); node.classList.remove("dragover");
        const ingredientId = e.dataTransfer.getData("text/plain") || ui.dragIngredientId; if (!ingredientId) return; if (node.dataset.dropTarget === "pot") addIngredient(ingredientId); if (node.dataset.dropTarget === "mouth") eatIngredientById(ingredientId); ui.dragIngredientId = null;
      });
      document.getElementById("newMemoButton").onclick = goStart;
      document.getElementById("toggleHistoryButton").onclick = () => { ui.collapsedHistory = !ui.collapsedHistory; render(); };
      document.getElementById("restoreActiveButton").onclick = () => { const active = getActiveMemo(); if (!active) return toast("복원할 최근 세션이 없습니다."); clearInterval(ui.detailTimer); ui.detailId = null; ui.mode = active.status === "complete" ? "detail" : active.status; state.activeId = active.id; persist(); render(); };
    }

    function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return { activeId: null, memos: [] }; const parsed = JSON.parse(raw); return { activeId: parsed.activeId || null, memos: Array.isArray(parsed.memos) ? parsed.memos.map(normalizeMemo).filter(Boolean) : [] }; } catch { return { activeId: null, memos: [] }; } }
    function normalizeMemo(memo) { if (!memo || typeof memo !== "object") return null; return { id: String(memo.id || uid()), title: String(memo.title || "제목 없음"), createdAt: Number(memo.createdAt || Date.now()), updatedAt: Number(memo.updatedAt || Date.now()), status: ["cooking","eating","stun","complete"].includes(memo.status) ? memo.status : "cooking", spice: clamp(Number(memo.spice ?? INITIAL_SPICE), 0, 100), ingredients: Array.isArray(memo.ingredients) ? memo.ingredients.map(String) : [], timeline: Array.isArray(memo.timeline) ? memo.timeline : [], stunEndsAt: Number(memo.stunEndsAt || 0), completedAt: Number(memo.completedAt || 0), note: String(memo.note || "") }; }
    function getMemo(id) { return state.memos.find((m) => m.id === id) || null; }
    function getActiveMemo() { return getMemo(state.activeId); }
    function getDetailMemo() { return getMemo(ui.detailId || state.activeId); }
    function getIngredient(id) { return INGREDIENTS.find((x) => x.id === id) || INGREDIENTS[0]; }
    function ingredientArt(ingredient) {
      const art = {
        beef: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><defs><linearGradient id="g1" x1="0" x2="1"><stop stop-color="#ff9a7b"/><stop offset="1" stop-color="#c83e2d"/></linearGradient></defs><rect width="180" height="120" rx="28" fill="#1c0b08"/><path d="M34 58c20-18 37-22 61-22 26 0 40 10 53 26 8 10 10 24 1 33-10 10-28 14-51 14-25 0-48-5-61-18-11-10-14-21-3-33Z" fill="url(#g1)"/><path d="M58 45c8-8 19-11 33-11 16 0 27 4 37 13" fill="none" stroke="#ffd3c7" stroke-width="8" stroke-linecap="round" opacity=".55"/></svg>`,
        glass: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#130e17"/><path d="M45 27c10 0 17 7 17 17v35c0 10-7 18-17 18S28 89 28 79V44c0-10 7-17 17-17Z" fill="#e5eef8" opacity=".12"/><path d="M43 29c7 0 12 5 12 12v36c0 7-5 13-12 13s-12-6-12-13V41c0-7 5-12 12-12Z" fill="#d8e7ff" opacity=".45"/><path d="M77 27c10 0 17 7 17 17v35c0 10-7 18-17 18s-17-8-17-18V44c0-10 7-17 17-17Z" fill="#eef5ff" opacity=".9"/><path d="M109 27c10 0 17 7 17 17v35c0 10-7 18-17 18s-17-8-17-18V44c0-10 7-17 17-17Z" fill="#e5eef8" opacity=".16"/><path d="M142 27c10 0 17 7 17 17v35c0 10-7 18-17 18s-17-8-17-18V44c0-10 7-17 17-17Z" fill="#eef5ff" opacity=".72"/></svg>`,
        mushroom: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#120b08"/><ellipse cx="90" cy="52" rx="58" ry="28" fill="#b47a5d"/><path d="M70 52c6 20 10 30 20 36 10-6 14-16 20-36" fill="#f2d3b8" opacity=".92"/><circle cx="78" cy="48" r="5" fill="#f7e5d7"/><circle cx="98" cy="45" r="4" fill="#f7e5d7"/><circle cx="111" cy="52" r="4" fill="#f7e5d7"/></svg>`,
        fishball: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#0f1118"/><circle cx="62" cy="55" r="26" fill="#f6f7fb"/><circle cx="118" cy="55" r="26" fill="#f1f3f9"/><circle cx="62" cy="55" r="8" fill="#fff3c9" opacity=".7"/><circle cx="118" cy="55" r="8" fill="#fff3c9" opacity=".7"/></svg>`,
        tofu: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#0f0b0a"/><rect x="48" y="26" width="84" height="64" rx="12" fill="#f3e9cc"/><rect x="58" y="36" width="64" height="44" rx="8" fill="#fff8e8" opacity=".85"/></svg>`,
        cabbage: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#0f130d"/><path d="M90 24c18 0 34 8 43 22 9 14 7 32-2 44-10 13-24 18-41 18s-31-5-41-18c-9-12-11-30-2-44 9-14 25-22 43-22Z" fill="#97e0a6"/><path d="M90 30c10 9 15 19 15 30 0 12-5 22-15 32-10-10-15-20-15-32 0-11 5-21 15-30Z" fill="#c8f4cb" opacity=".86"/></svg>`,
        sausage: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#120c0c"/><rect x="40" y="44" width="100" height="32" rx="16" fill="#d15c5c"/><rect x="48" y="50" width="84" height="20" rx="10" fill="#f18c7e" opacity=".45"/></svg>`,
        shrimp: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#140b0a"/><path d="M62 79c20 8 44 3 58-15 9-12 11-25 3-36-9-12-25-15-39-10-17 6-28 21-31 38-1 10 2 19 9 23Z" fill="#ff9775"/><path d="M67 72c14 5 30 2 39-9" fill="none" stroke="#ffd8bf" stroke-width="6" stroke-linecap="round" opacity=".65"/></svg>`,
        moon: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#0e0a11"/><path d="M43 62c18-20 42-28 73-24 11 2 18 10 18 19 0 9-7 17-18 19-31 4-55-4-73-24Z" fill="#f0c88e"/><path d="M57 60c10-10 26-15 47-14" fill="none" stroke="#fff3d8" stroke-width="8" stroke-linecap="round" opacity=".55"/></svg>`,
        ricecake: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#0f0b09"/><rect x="52" y="36" width="76" height="48" rx="12" fill="#f3e9d6"/><rect x="60" y="44" width="60" height="32" rx="10" fill="#fff7eb" opacity=".85"/></svg>`,
        noodle: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120"><rect width="180" height="120" rx="28" fill="#120a08"/><path d="M46 44c26-22 62-22 88 0" fill="none" stroke="#f4db98" stroke-width="8" stroke-linecap="round"/><path d="M42 62c30-20 66-20 96 0" fill="none" stroke="#ffd98d" stroke-width="8" stroke-linecap="round"/><path d="M50 78c24-16 56-16 80 0" fill="none" stroke="#f4db98" stroke-width="8" stroke-linecap="round"/></svg>`,
      };
      const svg = art[ingredient.id] || art.noodle;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }
    function labelForMode(mode) { return ({ start: "시작", cooking: "조리 중", eating: "먹는 중", stun: "기절", complete: "완탕", detail: "상세" })[mode] || "시작"; }
    function statusLabel(status) { return ({ cooking: "조리 중", eating: "먹는 중", stun: "기절", complete: "완탕", detail: "상세" })[status] || "대기"; }
    function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {} }
    function toast(text, duration = 1300) { els.toast.textContent = text; els.toast.classList.add("show"); setTimeout(() => { els.toast.classList.remove("show"); }, duration); }
    function goStart() { clearInterval(ui.detailTimer); ui.detailId = null; ui.mode = "start"; state.activeId = null; persist(); render(); }

    function createMemo(title) { if (!title) return toast("메모 제목을 입력해 주세요."); const now = Date.now(); const memo = { id: uid(), title, createdAt: now, updatedAt: now, status: "cooking", spice: INITIAL_SPICE, ingredients: [], timeline: [{ type: "create", at: now, title, spice: INITIAL_SPICE, note: "국물만 있는 빈 냄비로 시작" }], stunEndsAt: 0, completedAt: 0, note: "" }; state.memos.unshift(memo); state.activeId = memo.id; ui.mode = "cooking"; ui.detailId = null; document.getElementById("memoInput").value = ""; toast("주문이 들어갔어요. 조리를 시작합니다.", 1600); persist(); render(); }
    function addIngredient(ingredientId) { const memo = getActiveMemo(); if (!memo || !ingredientId || memo.status === "complete" || memo.status === "stun") return; const ing = getIngredient(ingredientId); memo.ingredients.push(ingredientId); memo.updatedAt = Date.now(); memo.timeline.push({ type: "ingredient-add", at: memo.updatedAt, ingredientId, name: ing.name, price: ing.price, emoji: ing.emoji, note: `${ing.name} 추가` }); state.activeId = memo.id; persist(); toast(`${ing.name}을(를) 넣었어요.`); render(); }
    function serveCurrentMemo() { const memo = getActiveMemo(); if (!memo || memo.status === "complete") return; const now = Date.now(); memo.status = "eating"; memo.updatedAt = now; memo.timeline.push({ type: "serve", at: now, note: "마라탕이 조리되어 먹기 화면으로 이동" }); state.activeId = memo.id; ui.mode = "eating"; ui.overlayText = "마라탕이 조리되었습니다!"; ui.overlaySub = "손님이 마라탕을 받았습니다. 이제 먹어볼까요?"; ui.overlayUntil = now + 1400; toast("먹기 화면으로 넘어갑니다."); persist(); render(); }
    function setSpice(value) { const memo = getActiveMemo(); if (!memo || memo.status === "complete") return; memo.spice = clamp(value, 0, 100); memo.updatedAt = Date.now(); memo.timeline.push({ type: "spice-set", at: memo.updatedAt, spice: memo.spice, note: `맵기 ${memo.spice}로 조절` }); persist(); render(); }
    function eatBite() { const memo = getActiveMemo(); if (!memo || memo.status === "stun" || memo.status === "complete") return; const ingredientId = memo.ingredients.length ? memo.ingredients.shift() : null; eatIngredientById(ingredientId); }
    function eatIngredientById(ingredientId) { const memo = getActiveMemo(); if (!memo || memo.status === "stun" || memo.status === "complete") return; let removed = null; if (ingredientId) { const idx = memo.ingredients.indexOf(ingredientId); if (idx >= 0) removed = memo.ingredients.splice(idx,1)[0]; } const now = Date.now(); const fast = now - ui.lastEatAt < 1300; ui.eatCombo = fast ? ui.eatCombo + 1 : 1; ui.lastEatAt = now; const gain = Math.min(14, 7 + ui.eatCombo * 2); memo.spice = clamp(memo.spice + gain, 0, 100); memo.updatedAt = now; memo.timeline.push({ type: "eat", at: now, ingredientId: removed, combo: ui.eatCombo, gain, spice: memo.spice, note: removed ? `${getIngredient(removed).name}을(를) 먹음` : `한 입 먹기 +${gain}` }); if (memo.spice >= 100) startStun(memo); else memo.status = "eating"; state.activeId = memo.id; persist(); toast(removed ? `${getIngredient(removed).name}을(를) 먹었어요.` : `한 입 먹기! 맵기 +${gain}`); render(); }
    function startStun(memo) { const now = Date.now(); memo.status = "stun"; memo.stunEndsAt = now + 10000; memo.timeline.push({ type: "stun-start", at: now, until: memo.stunEndsAt, spiceBeforeReset: memo.spice, resetTo: 50, note: "맵기 100 도달, 10초 기절" }); memo.spice = 50; ui.mode = "stun"; ui.overlayText = "🔥 너무 맵다! 10초 기절 중..."; ui.overlaySub = "백그라운드로 보내도 타이머는 계속 진행됩니다."; ui.overlayUntil = memo.stunEndsAt; persist(); render(); }
    function completeCurrentMemo() { const memo = getActiveMemo(); if (!memo || memo.status === "complete") return; const now = Date.now(); memo.status = "complete"; memo.completedAt = now; memo.updatedAt = now; memo.timeline.push({ type: "complete", at: now, note: "완탕 완료" }); state.activeId = memo.id; ui.mode = "complete"; ui.overlayText = "마라탕이 조리되었습니다!"; ui.overlaySub = "손님이 마라탕을 받아갔습니다. 완탕 완료!"; ui.overlayUntil = now + 2200; ui.confetti = true; toast("완탕! 기록이 저장되었습니다."); persist(); render(); setTimeout(() => { ui.confetti = false; ui.overlayUntil = 0; ui.overlayText = ""; ui.overlaySub = ""; ui.mode = "detail"; openDetail(memo.id, false); }, 2200); }
    function openDetail(id, save = true) { const memo = getMemo(id); if (!memo) return; clearInterval(ui.detailTimer); ui.detailId = id; ui.detailIndex = 0; ui.mode = "detail"; state.activeId = id; if (save) persist(); startReplay(); render(); }
    function startReplay() { clearInterval(ui.detailTimer); const memo = getDetailMemo(); if (!memo) return; ui.detailIndex = 0; render(); ui.detailTimer = setInterval(() => { const current = getDetailMemo(); if (!current) return clearInterval(ui.detailTimer); if (ui.detailIndex < current.timeline.length - 1) { ui.detailIndex += 1; render(); return; } clearInterval(ui.detailTimer); }, 850); }
    function startTickers() { if (ui.stunTicker) clearInterval(ui.stunTicker); ui.stunTicker = setInterval(() => { const memo = getActiveMemo(); if (memo && memo.status === "stun" && memo.stunEndsAt) { const remaining = memo.stunEndsAt - Date.now(); if (remaining <= 0) { memo.status = "eating"; memo.stunEndsAt = 0; memo.timeline.push({ type: "stun-end", at: Date.now(), note: "기절 종료" }); ui.mode = "eating"; ui.overlayUntil = 0; ui.overlayText = ""; ui.overlaySub = ""; persist(); render(); } else { ui.mode = "stun"; ui.overlayText = `🔥 너무 맵다! ${Math.ceil(remaining/1000)}초 기절 중...`; ui.overlaySub = "맵기 100 상태입니다. 잠시만 기다리세요."; renderLight(); } } if (ui.overlayUntil && Date.now() >= ui.overlayUntil) { ui.overlayUntil = 0; ui.overlayText = ""; ui.overlaySub = ""; if (ui.mode === "complete") ui.mode = "detail"; render(); } }, 200); }

    function render() { renderShell(); renderHistory(); renderTopbar(); renderScene(); renderReceipt(); renderOverlay(); persist(); }
    function renderLight() { renderTopbar(); renderReceipt(); renderOverlay(); }
    function renderShell() { const isDetail = ui.mode === "detail"; const isStart = ui.mode === "start"; els.sidebar.classList.toggle("collapsed", isDetail || ui.collapsedHistory); els.sceneShell.classList.toggle("start-mode", isStart); }
    function renderTopbar() { const memo = ui.mode === "detail" ? getDetailMemo() : getActiveMemo(); els.modeChip.textContent = labelForMode(ui.mode); els.memoLabel.textContent = memo ? memo.title : "오늘의 마라탕을 만들어보아요."; els.toggleHistoryButton.textContent = (ui.mode === "detail" || ui.collapsedHistory) ? "히스토리 펼치기" : "히스토리 접기"; const has = Boolean(getActiveMemo()); els.restoreActiveButton.disabled = !has; els.restoreActiveButton.style.opacity = has ? "1" : ".6"; els.restoreActiveButton.style.cursor = has ? "pointer" : "not-allowed"; }
    function renderHistory() { const memos = [...state.memos].sort((a,b) => b.updatedAt - a.updatedAt); if (!memos.length) { els.historyList.innerHTML = '<div class="empty-note">아직 기록이 없어요.<br/>메모를 입력하면 여기 쌓입니다.</div>'; return; } els.historyList.innerHTML = memos.map((memo) => `<button class="memo-item ${memo.id === state.activeId ? 'active' : ''}" type="button" data-history-id="${memo.id}"><div class="memo-title-row"><div class="memo-title">${escapeHTML(memo.title)}</div><span class="pill">${statusLabel(memo.status)}</span></div><div class="memo-sub">재료 ${memo.ingredients.length}개 · 맵기 ${memo.spice} · ${formatTime(memo.updatedAt)}</div><div class="memo-meta">${memo.timeline.length}단계 기록됨</div></button>`).join(""); }
    function renderScene() {
      try {
        if (ui.mode === "start") return renderStartScene();
        if (ui.mode === "detail") return renderDetailScene();
        return renderPlayScene();
      } catch (error) {
        console.error("renderScene failed", error);
        return renderFallbackScene(error);
      }
    }

    function renderFallbackScene(error) {
      const memo = getActiveMemo();

    function reconstructMemo(memo, uptoIndex) { if (!memo) return null; const base = { ...memo, ingredients: [], spice: INITIAL_SPICE, status: "cooking", stunEndsAt: 0 }; for (const step of memo.timeline.slice(0, uptoIndex + 1)) { if (step.type === "create") base.spice = step.spice ?? INITIAL_SPICE; else if (step.type === "ingredient-add" && step.ingredientId) base.ingredients.push(step.ingredientId); else if (step.type === "spice-set") base.spice = clamp(step.spice, 0, 100); else if (step.type === "serve") base.status = "eating"; else if (step.type === "eat") { if (step.ingredientId) { const idx = base.ingredients.indexOf(step.ingredientId); if (idx >= 0) base.ingredients.splice(idx, 1); } base.spice = clamp(step.spice, 0, 100); } else if (step.type === "stun-start") { base.status = "stun"; base.spice = 100; base.stunEndsAt = step.until || 0; } else if (step.type === "stun-end") base.status = "eating"; else if (step.type === "complete") base.status = "complete"; } return base; }
    function deriveReceipt(memo) { const map = new Map(); for (const id of memo.ingredients) { const ing = getIngredient(id); const item = map.get(ing.id) || { label: ing.name, count: 0, total: 0 }; item.count += 1; item.total += ing.price; map.set(ing.id, item); } const lines = [...map.values()]; return { lines, total: lines.reduce((sum, line) => sum + line.total, 0) }; }
    function timelineTitle(step) { return ({ create: "주문 생성", "ingredient-add": "재료 추가", "spice-set": "맵기 조절", serve: "조리 완료", eat: "한 입 먹기", "stun-start": "기절 시작", "stun-end": "기절 종료", complete: "완탕 완료" })[step.type] || "기록"; }
    function timelineSubtitle(step) { return step.type === "create" ? "국물만 있는 빈 냄비에서 시작" : step.type === "ingredient-add" ? `${getIngredient(step.ingredientId).name} 추가` : step.type === "eat" ? (step.ingredientId ? `${getIngredient(step.ingredientId).name} 먹음` : `한 입 먹기 +${step.gain}`) : step.type === "serve" ? "마라탕이 조리됨" : step.type === "complete" ? "마라탕 종료" : "기록 단계"; }
    function startReplay() { clearInterval(ui.detailTimer); const memo = getDetailMemo(); if (!memo) return; ui.detailIndex = 0; render(); ui.detailTimer = setInterval(() => { const current = getDetailMemo(); if (!current) return clearInterval(ui.detailTimer); if (ui.detailIndex < current.timeline.length - 1) { ui.detailIndex += 1; render(); return; } clearInterval(ui.detailTimer); }, 850); }
    function startTickers() { if (ui.stunTicker) clearInterval(ui.stunTicker); ui.stunTicker = setInterval(() => { const memo = getActiveMemo(); if (memo && memo.status === "stun" && memo.stunEndsAt) { const remaining = memo.stunEndsAt - Date.now(); if (remaining <= 0) { memo.status = "eating"; memo.stunEndsAt = 0; memo.timeline.push({ type: "stun-end", at: Date.now(), note: "기절 종료" }); ui.mode = "eating"; ui.overlayUntil = 0; ui.overlayText = ""; ui.overlaySub = ""; persist(); render(); } else { ui.mode = "stun"; ui.overlayText = `🔥 너무 맵다! ${Math.ceil(remaining/1000)}초 기절 중...`; ui.overlaySub = "맵기 100 상태입니다. 잠시만 기다리세요."; renderLight(); } } if (ui.overlayUntil && Date.now() >= ui.overlayUntil) { ui.overlayUntil = 0; ui.overlayText = ""; ui.overlaySub = ""; if (ui.mode === "complete") ui.mode = "detail"; render(); } }, 200); }
    function stunRemaining(memo) { return memo?.stunEndsAt ? Math.max(0, Math.ceil((memo.stunEndsAt - Date.now()) / 1000)) : 0; }
    function formatTime(ts) { const d = new Date(ts); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
    function formatPrice(value) { return `${Number(value).toLocaleString("ko-KR")}원`; }
    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function uid() { return window.crypto?.randomUUID ? crypto.randomUUID() : `memo-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`; }
    function escapeHTML(value) { return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;"); }
    function renderHistoryItem(memo) { return `<button class="memo-item ${memo.id === state.activeId ? 'active' : ''}" type="button" data-history-id="${memo.id}"><div class="memo-title-row"><div class="memo-title">${escapeHTML(memo.title)}</div><span class="pill">${statusLabel(memo.status)}</span></div><div class="memo-sub">재료 ${memo.ingredients.length}개 · 맵기 ${memo.spice} · ${formatTime(memo.updatedAt)}</div><div class="memo-meta">${memo.timeline.length}단계 기록됨</div></button>`; }
    function renderHistory() { const memos = [...state.memos].sort((a,b) => b.updatedAt - a.updatedAt); els.historyList.innerHTML = memos.length ? memos.map(renderHistoryItem).join("") : '<div class="empty-note">아직 기록이 없어요.<br/>메모를 입력하면 여기 쌓입니다.</div>'; }
    function renderPlayScene() { const memo = getActiveMemo(); if (!memo) return; const hint = ui.mode === "cooking" ? "재료를 끓이고, 맵기를 고르고, 오른쪽 영수증을 채우세요." : ui.mode === "eating" ? "이제 먹는 재미가 시작됩니다. 맵기 100에 가까워질수록 긴장감이 커집니다." : ui.mode === "stun" ? `맵기 100에 도달해 기절 중입니다. ${stunRemaining(memo)}초 뒤 복귀합니다.` : ""; els.scene.innerHTML = `<div class="scene-body"><div class="scene-header"><div><h2>${escapeHTML(memo.title)}</h2><p>${escapeHTML(hint)}</p></div><span class="pill">${labelForMode(ui.mode)}</span></div><div class="stage">${renderPotScene(memo, false)}${renderStageControls(memo)}</div></div>`; }
  </script>
</body>
</html>
